<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السلف - صالون لمسة إبداعية</title>
<style>
body{font-family:'Cairo',sans-serif;background:#f5f6fa;margin:0;padding:20px}
.container{max-width:1100px;margin:auto;background:#fff;border-radius:12px;padding:20px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
h1{text-align:center;margin-bottom:20px}

.form-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:15px}
input,select,button{padding:10px;border-radius:8px;border:1px solid #ccc}
button{cursor:pointer}

.employee-cards{display:flex;flex-wrap:wrap;gap:15px;margin-bottom:20px}
.employee-card{
background:#4cd137;color:#fff;border-radius:12px;
padding:15px;flex:1 1 180px;text-align:center;
position:relative
}
.employee-card span{display:block;font-size:22px;margin-top:8px}

.delete-btn,.remove-emp{
position:absolute;top:6px;border:none;color:#fff;
border-radius:50%;width:26px;height:26px;
font-weight:bold;cursor:pointer
}
.delete-btn{right:6px;background:#e84118}
.remove-emp{left:6px;background:#2f3640}

table{width:100%;border-collapse:collapse}
th,td{text-align:center;padding:10px;border-bottom:1px solid #ddd}
th{background:#f1f2f6}

.btn-delete{background:#e84118;color:#fff;border:none;padding:6px 12px;border-radius:6px}

.total-card{
background:#ff6b81;color:#fff;border-radius:12px;
padding:20px;text-align:center;font-size:20px;margin-bottom:20px
}
.total-card span{font-size:32px;display:block}

.employee-sent{background:#fff3cd}
.employee-manual{background:#d4edda}
</style>
</head>

<body>
<div class="container">

<h1>سلف الموظفين</h1>

<!-- إضافة سلفة -->
<div class="form-row">
<select id="employeeName"></select>
<button onclick="addEmployee()">+</button>
<input type="number" id="withdrawAmount" placeholder="المبلغ">
<input type="date" id="withdrawDate">
<button onclick="addWithdrawal()">إضافة سلفة</button>
<button onclick="goBack()">رجوع للقائمة</button>
</div>

<!-- إجمالي -->
<div class="total-card">
إجمالي السلف
<span id="totalWithdrawals">0</span> ريال
</div>

<!-- بطاقات الموظفين -->
<div class="employee-cards" id="employeeCards"></div>

<!-- جدول السلف -->
<table>
<thead>
<tr>
<th>الموظف</th>
<th>المبلغ</th>
<th>التاريخ</th>
<th>المصدر</th>
<th>حذف</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>
/* البيانات */
let employees = JSON.parse(localStorage.getItem('employees')) || ["أحمد","ياسر","محمد"];
let withdrawals = JSON.parse(localStorage.getItem('salfData')) || [];

localStorage.setItem('employees', JSON.stringify(employees));
localStorage.setItem('salfData', JSON.stringify(withdrawals));

function generateID(){
    return '_' + Math.random().toString(36).substr(2,9);
}

/* تحميل الموظفين */
function populateEmployees(){
    const s=document.getElementById('employeeName');
    s.innerHTML='<option value="">اختر الموظف</option>';
    employees.forEach(e=>{
        let o=document.createElement('option');
        o.value=e;o.textContent=e;
        s.appendChild(o);
    });
}

/* إضافة موظف */
function addEmployee(){
    let n=prompt('اسم الموظف');
    if(n && !employees.includes(n)){
        employees.push(n);
        localStorage.setItem('employees',JSON.stringify(employees));
        populateEmployees();
        draw();
    }
}

/* إضافة سلفة (يدوية) */
function addWithdrawal(){
    let emp=employeeName.value;
    let amt=+withdrawAmount.value;
    let date=withdrawDate.value;
    if(!emp||!amt||!date)return alert('اكمل البيانات');

    withdrawals.push({
        id:generateID(),
        employee:emp,
        amount:amt,
        date:date,
        sentByEmployee:false
    });

    localStorage.setItem('salfData',JSON.stringify(withdrawals));
    withdrawAmount.value='';withdrawDate.value='';
    draw();
}

/* رسم الجدول */
function drawTable(){
    const tb=document.getElementById('tbody');
    tb.innerHTML='';
    let total=0;

    withdrawals.forEach(w=>{
        total+=w.amount;
        tb.innerHTML+=`
        <tr class="${w.sentByEmployee?'employee-sent':'employee-manual'}">
            <td>${w.employee}</td>
            <td>${w.amount}</td>
            <td>${w.date}</td>
            <td>${w.sentByEmployee?'موظف':'مدير'}</td>
            <td><button class="btn-delete" onclick="deleteWithdrawal('${w.id}')">حذف</button></td>
        </tr>`;
    });

    totalWithdrawals.textContent=total.toFixed(2);
}

/* رسم البطاقات (تجمع الكل) */
function drawCards(){
    const c=document.getElementById('employeeCards');
    c.innerHTML='';

    employees.forEach(emp=>{
        let empList = withdrawals.filter(w=>w.employee===emp);
        let sum = empList.reduce((a,b)=>a+b.amount,0);
        let sentCount = empList.filter(w=>w.sentByEmployee).length;

        c.innerHTML+=`
        <div class="employee-card">
            <button class="delete-btn" onclick="deleteEmployeeLoans('${emp}')">×</button>
            <button class="remove-emp" onclick="removeEmployee('${emp}')">−</button>
            ${emp}
            <span>${sum.toFixed(2)} ريال</span>
            ${sentCount?`<div style="font-size:13px">(${sentCount} مرسلة من الموظف)</div>`:''}
        </div>`;
    });
}

/* حذف سلفة واحدة */
function deleteWithdrawal(id){
    if(!confirm('هل تريد حذف هذه السلفة؟')) return;

    // حذف من البيانات المحلية
    withdrawals = withdrawals.filter(w => w.id !== id);

    // تحديث localStorage
    localStorage.setItem('salfData', JSON.stringify(withdrawals));

    // إعادة رسم الجدول والبطاقات
    draw();

    // تفعيل storage event لأي صفحات أخرى
    window.dispatchEvent(new Event('storage'));
}

/* حذف كل سلف موظف */
function deleteEmployeeLoans(emp){
    if(!confirm(`حذف كل سلف ${emp}؟`))return;
    withdrawals = withdrawals.filter(w=>w.employee!==emp);
    localStorage.setItem('salfData',JSON.stringify(withdrawals));
    draw();
    window.dispatchEvent(new Event('storage'));
}

/* حذف الموظف نهائيًا */
function removeEmployee(emp){
    if(!confirm(`حذف ${emp} نهائيًا؟`))return;
    employees = employees.filter(e=>e!==emp);
    withdrawals = withdrawals.filter(w=>w.employee!==emp);
    localStorage.setItem('employees',JSON.stringify(employees));
    localStorage.setItem('salfData',JSON.stringify(withdrawals));
    populateEmployees();
    draw();
    window.dispatchEvent(new Event('storage'));
}

/* إعادة رسم */
function draw(){
    drawTable();
    drawCards();
}

/* تزامن مع صفحة الموظف */
window.addEventListener('storage',e=>{
    if(e.key==='salfData'){
        withdrawals = JSON.parse(localStorage.getItem('salfData')||'[]');
        draw();
    }
});

populateEmployees();
draw();

/* زر العودة */
function goBack(){ window.location.href='dashboard.html'; }
</script>
</body>
</html>
